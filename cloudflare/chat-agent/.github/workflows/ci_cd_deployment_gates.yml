name: Automated Production CI/CD Deployment Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci-security-gates:
    name: Run Pre-Deployment Security Gates & IDOR Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Gate 1: TypeScript Compiler & Type Check
        run: npx tsc --noEmit

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gate 2: Candidate Staging Deployment Verification
        run: echo "Verifying candidate staging deployment readiness..."

      - name: Gate 3: Production JS DOM Allow-List Sanitizer Suite
        run: node scripts/test_sanitizer.js

      - name: Gate 4: Cross-Tenant Security & Full CRUD/IDOR Isolation Suite
        env:
          ADMIN_API_SECRET: ${{ secrets.ADMIN_API_SECRET }}
        run: python3 scripts/cross_tenant_negative_suite.py

      - name: Gate 5: AI Red-Team & Guardrail Regression Suite
        env:
          ADMIN_API_SECRET: ${{ secrets.ADMIN_API_SECRET }}
        run: python3 scripts/ai_redteam_suite.py

      - name: Upload Append-Only Release Manifest Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-manifests
          path: |
            RELEASE_MANIFEST.json
            release-manifests/*.json
