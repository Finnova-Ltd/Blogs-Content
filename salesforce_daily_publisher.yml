name: Salesforce & Enterprise CRM Daily Publisher

on:
  schedule:
    - cron: '0 0,6,12,18 * * *' # Runs 4x daily (every 6 hours)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-and-syndicate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci || npm install
          pip install --upgrade requests

      - name: Run Salesforce Ingestion Engine (Official News & Salesforce Ben)
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY || 'tyRzLEE5qX30IYR57baFHF6YxjNiVOoUftDC996z85bZ1089oK6LNE6k' }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY || 'ebUOmAjXLVCzZ1UMGjsvEJ92zFPp3WCsvNFD1ickiqE' }}
        run: |
          python3 scripts/ingest_salesforce_news.py
          npm run build

      - name: Commit and Push Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add posts.json public/posts.json feed.xml rss.xml public/feed.xml public/rss.xml pages/blog/ public/pages/blog/ src/data/blogPosts.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-Publish: Daily Salesforce & Enterprise CRM articles [skip ci]" && git push origin main)
