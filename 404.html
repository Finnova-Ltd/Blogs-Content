<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>404 Page Not Found | EZ Mortgage Broker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .error-hero {
      min-height: 70vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 20px;
      background: #f8fafc;
    }
    .error-card {
      max-width: 580px;
      background: #ffffff;
      padding: 48px 32px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(10, 37, 64, 0.08);
      border: 1.5px solid #e2e8f0;
    }
    .error-code {
      font-size: 5rem;
      font-weight: 900;
      color: #0A2540;
      line-height: 1;
      margin-bottom: 12px;
    }
    .error-title {
      font-size: 1.6rem;
      color: #1E293B;
      font-weight: 700;
      margin-bottom: 14px;
    }
    .error-desc {
      color: #64748B;
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .error-nav-links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }
    .btn-404-primary {
      background: #00876C;
      color: #ffffff !important;
      font-weight: 700;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn-404-primary:hover { background: #006852; }
    .btn-404-outline {
      background: transparent;
      color: #0A2540 !important;
      border: 1.5px solid #0A2540;
      font-weight: 700;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn-404-outline:hover { background: #0A2540; color: #ffffff !important; }
  </style>
</head>
<body>
  <div class="error-hero">
    <div class="error-card">
      <div class="error-code">404</div>
      <h1 class="error-title">Page Not Found</h1>
      <p class="error-desc">The financial guide, calculator, or page you are looking for may have moved or no longer exists. Let's get you back on track.</p>
      <div class="error-nav-links">
        <a href="/" class="btn-404-primary">🏠 Return to Home</a>
        <a href="/calculators" class="btn-404-outline">📊 Mortgage Calculators</a>
        <a href="/pages/blog" class="btn-404-outline">📚 Blog & Insights</a>
        <a href="tel:1300050099" class="btn-404-outline">📞 Call 1300 050 099</a>
      </div>
    </div>
  </div>
</body>
</html>
