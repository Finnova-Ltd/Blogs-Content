name: Monthly Multi-Site Cold Storage Archival

on:
  schedule:
    - cron: '0 2 1 * *' # Runs at 02:00 AM on the 1st of every month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive-and-rollover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Cold Archival & R2 Rollover Engine
        run: |
          python3 scripts/archive_cold_articles.py

      - name: Commit and Push Archive Bundles
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add archives/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-Archive: Monthly cold storage rollover [skip ci]" && git push origin main)
