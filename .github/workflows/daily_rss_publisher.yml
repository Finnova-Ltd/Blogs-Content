name: Daily Mortgage News & RSS Publisher

on:
  schedule:
    # Runs everyday at 20:00 UTC (06:00 AM AEST)
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-daily-articles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Extract Google Alerts & Generate Articles
        run: python3 scripts/fetch_google_alerts.py --publish

      - name: Generate Updated RSS 2.0 Feed
        run: python3 scripts/generate_rss_feed.py

      - name: Build Production Bundle
        run: npm run build

      - name: Commit and push updates
        run: |
          git config --global user.name "EZ Broker Automated Publisher"
          git config --global user.email "bot@ezmortgagebroker.com.au"
          git add pages/blog/ posts.json rss.xml feed.xml sitemap.xml public/
          if git diff --staged --quiet; then
            echo "No new alerts to publish today."
          else
            git commit -m "Auto-Publish: Daily mortgage market news and RSS feed update [skip ci]"
            git push origin main
          fi
