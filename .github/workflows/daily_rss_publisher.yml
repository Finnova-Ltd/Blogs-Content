name: Master Multi-Site News, Content & Auto-RAG Publisher

on:
  schedule:
    - cron: "0 20,2,8,14 * * *" # 6AM, 12PM, 6PM, 12AM AEST (4x daily)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-all-sites:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          pip install --upgrade requests feedparser beautifulsoup4 lxml || true
          if [ -f package.json ]; then
            npm install --no-audit --no-fund || true
          fi

      - name: Ingest Multi-Topic Mortgage News & Australian Lending
        continue-on-error: true
        run: |
          python3 scripts/ingest_yahoo_topics.py || true
          python3 scripts/sync_blog_hub.py || true

      - name: Generate 91 Suburb Location Landing Pages
        continue-on-error: true
        run: |
          python3 scripts/generate_suburbs_and_pillars.py || true

      - name: Ingest Google Drive Asset Vault (PDF Whitepapers)
        continue-on-error: true
        env:
          GOOGLE_DRIVE_API_KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
        run: |
          python3 scripts/google_drive_pdf_extractor.py || true

      - name: Generate Common Cyber Security Articles for PRO CRM & Finnova
        continue-on-error: true
        run: |
          python3 scripts/generate_common_cyber_articles.py || true

      - name: Validate & Enforce Light-Colored Photography
        continue-on-error: true
        run: |
          python3 scripts/replace_dark_images.py || true

      - name: Auto-RAG Vectorize Articles into Cloudflare Vectorize
        continue-on-error: true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 scripts/embed_articles_to_vectorize.py || true

      - name: Build Production Bundle (if applicable)
        continue-on-error: true
        run: |
          if [ -f package.json ]; then
            npm run build || true
          fi

      - name: Commit and push updates to Blogs-Content
        run: |
          git config --global user.name "Finnova Multi-Site Publisher"
          git config --global user.email "bot@finnova.com.au"
          git add -A
          if git diff --staged --quiet; then
            echo "No new updates to commit."
          else
            git commit -m "Auto-Publish: Daily mortgage news, 91 suburb landing pages, cyber guides & vector cache [skip ci]"
            git pull --rebase origin main 2>/dev/null || true
            git push origin main
          fi

      - name: Notify on Automation Failure (Zero-Failure Monitor)
        if: failure()
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          python3 scripts/notify_failure.py "Daily Multi-Site Publisher workflow failed on Finnova-Ltd/Blogs-Content" || true
