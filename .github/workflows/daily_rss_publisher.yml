name: Daily Mortgage News & RSS Publisher

on:
  schedule:
    - cron: "0 20,2,8,14 * * *" # 6AM, 12PM, 6PM, 12AM AEST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-daily-articles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm install --no-audit --no-fund || true
          fi

      - name: Extract Google Alerts & Generate Articles
        run: |
          if [ -f scripts/fetch_google_alerts.py ]; then
            python3 scripts/fetch_google_alerts.py --publish || true
          fi
          if [ -f scripts/ingest_yahoo_topics.py ]; then
            python3 scripts/ingest_yahoo_topics.py || true
          fi

      - name: Generate Updated RSS 2.0 Feed
        run: |
          if [ -f scripts/generate_rss_feed.py ]; then
            python3 scripts/generate_rss_feed.py || true
          fi

      - name: Build Production Bundle
        run: |
          if [ -f package.json ]; then
            npm run build || true
          fi

      - name: Commit and push updates
        run: |
          git config --global user.name "EZ Broker Automated Publisher"
          git config --global user.email "bot@ezmortgagebroker.com.au"
          git add pages/blog/ posts.json rss.xml feed.xml sitemap.xml public/
          if git diff --staged --quiet; then
            echo "No new changes to commit today."
          else
            git commit -m "Auto-Publish: Daily mortgage market news and RSS feed update [skip ci]"
            git push origin main
          fi
